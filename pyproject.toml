[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Root project metadata. owa-tools ships as one suite distribution with
# one version and multiple console scripts.

[project]
name = "owa-tools"
version = "0.11.0"
description = "Monorepo workspace for owa-piggy consumer CLIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Carl Joakim Damsleth" }]

# Runtime deps: none. The whole suite is stdlib-only so it ships as a
# single self-contained distribution with no third-party runtime
# dependency. The CLI-contract surface lives in owa_core.conventions.
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.4",
]

[project.scripts]
# Umbrella binary plus one console script per consumer tool.
owa = "owa.cli:main"
owa-cal = "owa_cal:main"
owa-mail = "owa_mail:main"
owa-graph = "owa_graph:main"
owa-doctor = "owa_doctor:main"
owa-people = "owa_people:main"
owa-sched = "owa_sched:main"
owa-drive = "owa_drive:main"
owa-todo = "owa_todo:main"
owa-planner = "owa_planner:main"
owa-sites = "owa_sites:main"
owa-teams = "owa_teams:main"
owa-vids = "owa_vids:main"
owa-ado = "owa_ado:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
  "owa",
  "owa_core",
  "owa_cal",
  "owa_mail",
  "owa_graph",
  "owa_graph.resources",
  "owa_graph.data",
  "owa_doctor",
  "owa_people",
  "owa_sched",
  "owa_drive",
  "owa_todo",
  "owa_planner",
  "owa_sites",
  "owa_teams",
  "owa_vids",
  "owa_ado",
]

[tool.setuptools.package-data]
owa_graph = ["data/*.json", "data/*.json.gz"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E702", "E741", "B904", "B905"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = [
  "owa",
  "owa_core",
  "owa_cal",
  "owa_mail",
  "owa_graph",
  "owa_doctor",
  "owa_people",
  "owa_sched",
  "owa_drive",
  "owa_todo",
  "owa_planner",
  "owa_sites",
  "owa_teams",
  "owa_vids",
  "owa_ado",
]
omit = ["*/__main__.py"]

[tool.coverage.report]
# Combined line+branch floor for the whole runtime tree. owa_core has a
# stricter dedicated gate in CI (95% line+branch). Per
# .plans/03-test-strategy-and-coverage.md the long-term target is 90% line
# AND 85% branch on per-tool modules; this floor is the honest combined
# number we will ratchet upward as owa_todo / owa_people / owa_sched
# coverage closes the remaining gap.
fail_under = 89
show_missing = true
skip_covered = true
