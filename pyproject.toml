[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Root project metadata. owa-tools ships as one suite distribution with
# one version and multiple console scripts.

[project]
name = "owa-tools"
version = "0.1.0"
description = "Monorepo workspace for owa-piggy consumer CLIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Carl Joakim Damsleth" }]

# Runtime deps: stdlib only at the per-tool level. The workspace install
# pulls in every package as a local path during development.
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.4",
  "twine>=5",
]

[project.scripts]
# Umbrella binary plus one console script per consumer tool.
owa = "owa.cli:main"
owa-cal = "owa_cal:main"
owa-mail = "owa_mail:main"
owa-graph = "owa_graph:main"
owa-doctor = "owa_doctor:main"
owa-people = "owa_people:main"
owa-sched = "owa_sched:main"
owa-drive = "owa_drive:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
  "owa",
  "owa_core",
  "owa_cal",
  "owa_mail",
  "owa_graph",
  "owa_graph.resources",
  "owa_graph.data",
  "owa_doctor",
  "owa_people",
  "owa_sched",
  "owa_drive",
]

[tool.setuptools.package-data]
owa_graph = ["data/*.json", "data/*.json.gz"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E702", "E741", "B904", "B905"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q"

[tool.coverage.run]
source = [
  "owa",
  "owa_core",
  "owa_cal",
  "owa_mail",
  "owa_graph",
  "owa_doctor",
  "owa_people",
  "owa_sched",
  "owa_drive",
]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
