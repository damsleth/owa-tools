name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Stdlib-only check
        run: python src/scripts/check_stdlib_only.py
      - name: No-secret check
        run: python src/scripts/check_no_secrets.py
      - name: Docs sync check
        run: python src/scripts/check_docs_sync.py
      - name: Unit tests
        run: coverage run --source=owa_core -m pytest -q && coverage report --fail-under=95
      - name: Runtime coverage
        run: pytest -q --cov --cov-fail-under=90
      - name: Compatibility snapshots
        run: pytest -q src/tests/compat
      - name: Contract tests
        run: pytest -q src/tests/contract
      - name: Build package
        run: python -m build
      - name: Metadata check
        run: python -m twine check dist/*
      - name: Artifact check
        run: python src/scripts/check_artifacts.py dist/*
      - name: Console smoke
        run: python src/scripts/check_console_smoke.py
