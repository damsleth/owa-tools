name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Stdlib-only check
        run: python src/scripts/check_stdlib_only.py
      - name: No-secret check
        run: python src/scripts/check_no_secrets.py
      - name: Docs sync check
        run: python src/scripts/check_docs_sync.py
      - name: Unit tests (owa_core, line+branch 95% gate)
        run: coverage run --source=owa_core -m pytest -q && coverage report --fail-under=95
      - name: Runtime coverage (line+branch 89% gate)
        run: pytest -q --cov --cov-fail-under=89
      - name: Compatibility snapshots
        run: pytest -q src/tests/compat
      - name: Contract tests
        run: pytest -q src/tests/contract
      - name: Build package
        run: uv build
      - name: Artifact check
        run: python src/scripts/check_artifacts.py dist/*
      - name: Console smoke
        run: python src/scripts/check_console_smoke.py
