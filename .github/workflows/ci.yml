name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q owa owa_core owa_cal owa_mail owa_graph owa_doctor owa_people owa_sched owa_drive
      - name: Stdlib-only check
        run: python tools/check_stdlib_only.py
      - name: Unit tests
        run: pytest -q
      - name: Compatibility snapshots
        run: pytest -q tests/compat
      - name: Contract tests
        run: pytest -q tests/contract
      - name: Build package
        run: python -m build
