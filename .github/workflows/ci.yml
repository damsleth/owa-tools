name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Stdlib-only check
        run: python src/scripts/check_stdlib_only.py
      - name: No-secret check
        run: python src/scripts/check_no_secrets.py
      - name: Docs sync check
        run: python src/scripts/check_docs_sync.py
      - name: Unit tests (owa_core, line+branch 95% gate)
        run: coverage run --source=owa_core -m pytest -q && coverage report --fail-under=95
      - name: Runtime coverage (line+branch 89% gate)
        run: pytest -q --cov --cov-fail-under=89
      - name: Compatibility snapshots
        run: pytest -q src/tests/compat
      - name: Contract tests
        run: pytest -q src/tests/contract
      - name: Build package
        run: uv build
      - name: Artifact check
        run: python src/scripts/check_artifacts.py dist/*
      - name: Console smoke
        run: python src/scripts/check_console_smoke.py
