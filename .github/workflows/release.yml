name: Release

on:
  push:
    tags:
      - 'v*'

# Mirrors the gates in ci.yml so a tag never advertises a build that would
# fail mainline CI. PyPI publishing happens locally with `uv publish` against
# UV_PUBLISH_TOKEN from ./.env (see AGENTS.md "Cutting a release"). This
# workflow only re-runs gates, rebuilds the artifacts, and creates the
# GitHub Release with wheel + sdist attached.

permissions:
  contents: write    # create the GitHub Release and upload artifacts

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Stdlib-only check
        run: python src/scripts/check_stdlib_only.py
      - name: No-secret check
        run: python src/scripts/check_no_secrets.py
      - name: Docs sync check
        run: python src/scripts/check_docs_sync.py
      - name: Unit tests (owa_core 95% gate)
        run: coverage run --source=owa_core -m pytest -q && coverage report --fail-under=95
      - name: Runtime coverage (90% gate)
        run: pytest -q --cov --cov-fail-under=90
      - name: Compatibility snapshots
        run: pytest -q src/tests/compat
      - name: Contract tests
        run: pytest -q src/tests/contract

  build:
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e .[dev]
      - name: Resolve version from tag
        id: version
        run: |
          ref="${GITHUB_REF##*/}"
          version="${ref#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine metadata check
        run: python -m twine check dist/*
      - name: Artifact check
        run: python src/scripts/check_artifacts.py dist/*
      - name: Console smoke
        run: python src/scripts/check_console_smoke.py
      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: owa-tools v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
