name: Release

on:
  push:
    tags:
      - 'v*'

# Mirrors the gates in ci.yml so a tag never advertises a build that would
# fail mainline CI. PyPI publishing happens locally with `uv publish` against
# UV_PUBLISH_TOKEN from ./.env (see AGENTS.md "Cutting a release"). This
# workflow only re-runs gates, rebuilds the artifacts, and creates the
# GitHub Release with wheel + sdist attached.

permissions:
  contents: write    # create the GitHub Release and upload artifacts

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Stdlib-only check
        run: python src/scripts/check_stdlib_only.py
      - name: No-secret check
        run: python src/scripts/check_no_secrets.py
      - name: Docs sync check
        run: python src/scripts/check_docs_sync.py
      - name: Unit tests (owa_core, line+branch 95% gate)
        run: coverage run --source=owa_core -m pytest -q && coverage report --fail-under=95
      - name: Runtime coverage (line+branch 89% gate)
        run: pytest -q --cov --cov-fail-under=89
      - name: Compatibility snapshots
        run: pytest -q src/tests/compat
      - name: Contract tests
        run: pytest -q src/tests/contract

  build:
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install package (for artifact + console-smoke checks)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Resolve version from tag
        id: version
        run: |
          ref="${GITHUB_REF##*/}"
          version="${ref#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build sdist + wheel
        run: uv build
      - name: Artifact check
        run: python src/scripts/check_artifacts.py dist/*
      - name: Console smoke
        run: python src/scripts/check_console_smoke.py
      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  binaries:
    # Standalone PyInstaller bundles - no Python install required. One
    # multicall binary (packaging/owa.spec) plus a sibling symlink per console
    # script, archived per OS/arch. See packaging/pyinstaller_entry.py.
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: macos-13,      target: macos-x86_64 }
          - { os: macos-14,      target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve version from tag
        id: version
        run: |
          ref="${GITHUB_REF##*/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build multicall binary
        working-directory: packaging
        run: pyinstaller --clean --noconfirm owa.spec
      - name: Link sibling tools and archive
        working-directory: packaging/dist/owa
        run: |
          for name in $(python -c "from owa_core.registry import CONSUMER_TOOLS; print(' '.join(CONSUMER_TOOLS))"); do
            ln -sf owa "$name"
          done
          archive="owa-tools-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar czf "../../$archive" -C .. owa
          echo "built $archive"
      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: packaging/*.tar.gz
          if-no-files-found: error

  github-release:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: owa-tools v${{ needs.build.outputs.version }}
          generate_release_notes: true
          # artifacts/dist/* = wheel + sdist; artifacts/binary-*/* = standalone bundles
          files: |
            artifacts/dist/*
            artifacts/binary-*/*
          fail_on_unmatched_files: true
