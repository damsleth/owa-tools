[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owa-sched"
version = "0.1.0"
description = "Pipe-friendly scheduling assistant for Outlook / Microsoft 365"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Carl Joakim Damsleth" }]
dependencies = ["owa-piggy>=0.6.0"]
keywords = [
  "outlook",
  "microsoft-365",
  "calendar",
  "scheduling",
  "free-busy",
  "cli",
  "json",
  "graph",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/damsleth/owa-sched"
Repository = "https://github.com/damsleth/owa-sched"
Issues = "https://github.com/damsleth/owa-sched/issues"

[project.scripts]
owa-sched = "owa_sched:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["owa_sched"]
