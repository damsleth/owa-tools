[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owa-doctor"
version = "0.1.0"
description = "Health-check meta-CLI for the owa-* suite"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Carl Joakim Damsleth" }]
dependencies = []
keywords = [
  "outlook",
  "microsoft-365",
  "cli",
  "diagnostics",
  "json",
  "graph",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/damsleth/owa-doctor"
Repository = "https://github.com/damsleth/owa-doctor"
Issues = "https://github.com/damsleth/owa-doctor/issues"

[project.scripts]
owa-doctor = "owa_doctor:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["owa_doctor"]
